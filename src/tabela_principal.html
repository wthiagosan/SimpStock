<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela de Produtos</title>
    <link rel="stylesheet" href="Sistema_style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
</head>
<body>
    <header>
        <nav class="navigation">
            <img class="logo" src="imagens/logo.png" alt="SimStock">
            <ul class="nav-menu">
                <li class="nav-item"><a href="Tela_inicial.html"><strong>Voltar</strong></a></li>
            </ul>
        </nav>
    </header>

    <div class="page-content">
        <div class="top-bar">
            <h2 class="page-title">
                <i class="ti ti-package" aria-hidden="true"></i> Estoque de produtos
            </h2>
            <a href="Cadastro_de_produtos.html" class="btn-novo">
                <i class="ti ti-plus" aria-hidden="true"></i> Novo produto
            </a>
        </div>

        <div class="table-card">
            <table id="productTable">
                <thead>
                    <tr>
                        <th class="col-check">
                            <input type="checkbox" id="selectAll" title="Selecionar todos">
                        </th>
                        <th>Nome</th>
                        <th>Marca</th>
                        <th>Validade</th>
                        <th>Código</th>
                        <th>Qtd.</th>
                        <th>Referência</th>
                        <th>Endereço</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
            <div class="table-footer">
                <span id="contadorProdutos" class="contador"></span>
                <button id="excluirSelecionadosBtn" class="btn-excluir-sel" style="display: none;">
                    <i class="ti ti-trash" aria-hidden="true"></i> Excluir selecionados
                </button>
            </div>
        </div>
    </div>

    <script src="Sistema_script.js"></script>
    <script>
        document.getElementById('selectAll')?.addEventListener('change', function() {
            document.querySelectorAll('.select-product').forEach(cb => {
                cb.checked = this.checked;
            });
            if (window.atualizarBotaoExcluirSelecionados) atualizarBotaoExcluirSelecionados();
        });
    </script>
</body>
</html>
