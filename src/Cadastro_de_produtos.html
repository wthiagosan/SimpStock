<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos</title>
    <link rel="stylesheet" href="Sistema_style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
</head>
<body>
    <header>
        <nav class="navigation">
            <img class="logo" src="imagens/logo.png" alt="SimStock">
            <ul class="nav-menu">
                <li class="nav-item"><a href="Tela_inicial.html"><strong>Voltar</strong></a></li>
            </ul>
        </nav>
    </header>

    <div class="page-content">
        <div class="form-card">
            <div class="form-header">
                <i class="ti ti-package" aria-hidden="true"></i>
                <div>
                    <h1>Cadastro de produto</h1>
                    <p>Preencha os dados do novo item do estoque</p>
                </div>
            </div>

            <form id="productForm">
                <div class="form-grid">
                    <div class="field">
                        <label for="nome">
                            <i class="ti ti-tag" aria-hidden="true"></i> Nome do produto
                        </label>
                        <input type="text" id="nome" placeholder="Ex: Mesa de escritório" required>
                    </div>
                    <div class="field">
                        <label for="marca">
                            <i class="ti ti-building-store" aria-hidden="true"></i> Marca
                        </label>
                        <input type="text" id="marca" placeholder="Ex: Samsung" required>
                    </div>
                    <div class="field">
                        <label for="codigo">
                            <i class="ti ti-barcode" aria-hidden="true"></i> Código (SKU)
                        </label>
                        <input type="text" id="codigo" placeholder="Ex: SKU-0012" required>
                    </div>
                    <div class="field">
                        <label for="quantidade">
                            <i class="ti ti-hash" aria-hidden="true"></i> Quantidade
                        </label>
                        <input type="number" id="quantidade" placeholder="Ex: 50" min="0" required>
                    </div>
                    <div class="field">
                        <label for="referencia">
                            <i class="ti ti-git-branch" aria-hidden="true"></i> Referência
                        </label>
                        <input type="text" id="referencia" placeholder="Ex: REF-001" required>
                    </div>
                    <div class="field">
                        <label for="validade">
                            <i class="ti ti-calendar" aria-hidden="true"></i> Validade
                            <span class="badge-opcional">opcional</span>
                        </label>
                        <input type="date" id="validade">
                    </div>
                    <div class="field field-full">
                        <label for="endereco">
                            <i class="ti ti-map-pin" aria-hidden="true"></i> Endereço no estoque
                            <span class="badge-opcional">opcional</span>
                        </label>
                        <input type="text" id="endereco" placeholder="Ex: Prateleira A3, corredor 2">
                    </div>
                </div>

                <div class="form-footer">
                    <a href="tabela_principal.html" class="btn-voltar">
                        <i class="ti ti-arrow-left" aria-hidden="true"></i> Voltar
                    </a>
                    <button type="submit" class="btn-salvar">
                        <i class="ti ti-circle-check" aria-hidden="true"></i> Cadastrar produto
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="Sistema_script.js"></script>
</body>
</html>
